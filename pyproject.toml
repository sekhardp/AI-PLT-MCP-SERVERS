[project]
name = "ai-plt-mcp-servers"
version = "0.1.0"
description = "AI Platform MCP Servers (RAG Knowledge Base, PPT Generator & Sales Analytics)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rag-server",
    "ppt-server",
    "sales-products-server",
    "weather-server",
    "registry-gateway",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.30",
    "fastmcp>=0.1.0",
    "greenlet>=3.0.0",
]

[tool.uv.sources]
rag-server = { workspace = true }
ppt-server = { workspace = true }
sales-products-server = { workspace = true }
weather-server = { workspace = true }
registry-gateway = { workspace = true }

[tool.uv]
workspace = { members = ["registry", "servers/*"]}

[tool.pytest.ini_options]
pythonpath = ["servers/rag_server/src", "servers/ppt_server/src", "servers/sales_products_server/src", "servers/weather_server/src", "registry/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

