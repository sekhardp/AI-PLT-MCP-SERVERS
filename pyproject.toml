[project]
name = "ai-plt-mcp-servers"
version = "0.1.0"
description = "AI Platform MCP Servers (RAG Knowledge Base & BigQuery)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rag-server",
    "bigQuery-server",
    "sgs-bq-server",
    "registry-gateway",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.30",
    "fastmcp>=0.1.0",
    "greenlet>=3.0.0",
]

[tool.uv.sources]
rag-server = { workspace = true }
bigQuery-server = { workspace = true }
sgs-bq-server = { workspace = true }
registry-gateway = { workspace = true }

[tool.uv]
workspace = { members = ["registry", "servers/*"]}

[tool.pytest.ini_options]
pythonpath = ["servers/rag_server/src", "servers/bigQuery_server/src", "servers/sgs_bq_server/src", "registry/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
