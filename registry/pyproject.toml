[project]
name = "registry-gateway"
version = "0.1.0"
description = "MCP Registry Gateway that aggregates separate servers"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",   # Official MCP SDK (core client/server classes)
    "fastapi>=0.115.0",  # Web framework to host the gateway endpoint
    "uvicorn>=0.30.0",   # ASGI server to run the gateway
    "httpx>=0.27.0",     # Async HTTP client to make proxy requests to sub-servers
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allows running the registry globally via: uv run registry-gateway
[project.scripts]
registry-gateway = "registry_gateway.main:main"
