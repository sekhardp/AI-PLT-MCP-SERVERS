[project]
name = "sgs-bq-server"
version = "0.1.0"
description = "MCP BigQuery Server for Suntory GCP Procurement and Productivity Analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.1.0",
    "fastmcp-docs",
    "google-cloud-bigquery>=3.0.0",
    "google-auth>=2.0.0",
    "starlette>=0.20.0",
    "uvicorn>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sgs-bq-server = "sgs_bq_server.main:main"