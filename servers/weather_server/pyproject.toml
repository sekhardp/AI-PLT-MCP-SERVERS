[project]
name = "weather-server"
version = "0.1.0"
description = "MCP Weather & Air Quality Server powered by Open-Meteo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp-weather-server>=0.6.1",
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.1.0",
    "starlette>=0.20.0",
    "uvicorn>=0.20.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
weather-server = "weather_server.main:main"
