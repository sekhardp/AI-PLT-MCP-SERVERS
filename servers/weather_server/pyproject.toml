[project]
name = "weather-server"
version = "0.1.0"
description = "MCP Weather Server with dual stdio/SSE support"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",   # The official MCP SDK
    "fastmcp>=0.1.0",    # High-level developer-friendly framework
    "fastapi>=0.115.0",  # Web framework to host HTTP/SSE endpoints
    "uvicorn>=0.30.0",   # ASGI web server
    "httpx>=0.27.0",     # Async HTTP client for weather API calls
    "fastmcp-docs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
weather-server = "weather_server.main:main"
