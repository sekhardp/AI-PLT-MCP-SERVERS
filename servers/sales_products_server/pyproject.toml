[project]
name = "sales-products-server"
version = "0.1.0"
description = "Sales & Products BigQuery MCP Analytics Server for beam-suntory-gemini-llm-poc"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.1.0",
    "fastmcp-docs>=0.1.0",
    "google-cloud-bigquery>=3.25.0",
    "google-auth>=2.0.0",
    "pydantic>=2.0.0",
    "starlette>=0.20.0",
    "uvicorn>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sales-products-server = "sales_products_server.main:main"
