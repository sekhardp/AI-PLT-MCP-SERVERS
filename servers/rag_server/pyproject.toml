[project]
name = "rag-server"
version = "0.1.0"
description = "MCP RAG Server with Hybrid Search (pgvector + BM25) and dual stdio/SSE support"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "fastmcp>=0.1.0",
    "fastmcp-docs",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "greenlet>=3.0.0",
    "pgvector>=0.3.0",
    "google-genai>=1.2.0",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
rag-server = "rag_server.main:main"
