services:
  rag-server:
    build:
      context: .
      dockerfile: servers/rag_server/Dockerfile
    ports:
      - "${RAG_SERVER_PORT:-8020}:8080" # Maps local port 8020 to container port 8080
    environment:
      - PORT=8080
      - RAG_DB_URL=${RAG_DB_URL}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-us-central1}
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro

  ppt-server:
    build:
      context: .
      dockerfile: servers/ppt_server/Dockerfile
    ports:
      - "${PPT_SERVER_PORT:-8050}:8080" # Maps local port 8050 to container port 8080
    environment:
      - PORT=8080
      - MCP_TRANSPORT=sse

  sales-products-server:
    build:
      context: .
      dockerfile: servers/sales_products_server/Dockerfile
    ports:
      - "${SALES_PRODUCTS_SERVER_PORT:-8060}:8080" # Maps local port 8060 to container port 8080
    environment:
      - PORT=8080
      - BIGQUERY_PROJECT_ID=${BIGQUERY_PROJECT_ID:-beam-suntory-gemini-llm-poc}
      - BIGQUERY_DATASET_ID=${BIGQUERY_DATASET_ID:-sales_products}
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
      - MCP_TRANSPORT=sse
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro

  registry-gateway:
    build:
      context: .
      dockerfile: registry/Dockerfile
    ports:
      - "${REGISTRY_GATEWAY_PORT:-8081}:8080" # Maps local port 8081 to container port 8080
    environment:
      - PORT=8080
      - SERVER_RAG_SERVER_URL=${SERVER_RAG_SERVER_URL:-http://rag-server:8080/sse}
      - SERVER_PPT_SERVER_URL=${SERVER_PPT_SERVER_URL:-http://ppt-server:8080/sse}
      - SERVER_SALES_PRODUCTS_SERVER_URL=${SERVER_SALES_PRODUCTS_SERVER_URL:-http://sales-products-server:8080/sse}
    depends_on:
      - rag-server
      - ppt-server
      - sales-products-server

