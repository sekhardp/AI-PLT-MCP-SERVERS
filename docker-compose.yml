services:
  weather-server:
    build:
      context: .
      dockerfile: servers/weather_server/Dockerfile
    ports:
      - "8020:8080" # Maps local port 8020 to container port 8080
    environment:
      - PORT=8080

  registry-gateway:
    build:
      context: .
      dockerfile: registry/Dockerfile
    ports:
      - "8081:8080" # Maps local port 8081 to container port 8080
    environment:
      - PORT=8080
      # Connects to the weather-server service using docker's DNS resolution
      - SERVER_WEATHER_SERVER_URL=http://weather-server:8080/sse
    depends_on:
      - weather-server
